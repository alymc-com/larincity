<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قيّم خدمتنا · مجمع لارين السكني</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2F7">
<link rel="icon" href="/rate/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#1c1c1e;--mute:#6e6e73;--line:#e5e5ea;--gold:#C29B5F;--gold2:#E1C88F;--act:#0a84ff;--ok:#1f9d55;--bad:#d64545;--soft:#f5f5f7}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--mute:#98989d;--line:#2c2c2e;--soft:#2c2c2e;--act:#409cff}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:28px 16px 40px;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:12px}.top img{width:44px;height:44px;border-radius:12px}.top b{display:block;font-size:16px}.top small{color:var(--mute);font-size:13px}
.card{background:var(--card);border-radius:22px;padding:22px 20px;display:grid;gap:18px;border:1px solid var(--line)}
.who{display:flex;align-items:center;gap:14px}.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold2));flex:none}
.who h1{margin:0;font-size:19px}.who p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
h2{margin:0;font-size:15px;font-weight:600}.hint{margin:-10px 0 0;color:var(--mute);font-size:13px}
.stars{display:flex;justify-content:center;gap:6px}.stars button{border:0;background:none;padding:4px;cursor:pointer;color:var(--line);transition:transform .15s}
.stars button svg{width:42px;height:42px;fill:currentColor}.stars button.on{color:var(--gold)}.stars button:active{transform:scale(.9)}
.sl{text-align:center;color:var(--mute);font-size:13.5px;min-height:20px;margin-top:-8px}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;direction:ltr}.nps button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;height:38px;font:600 14px inherit;font-family:inherit;cursor:pointer;padding:0}
.nps button.on{background:var(--act);border-color:var(--act);color:#fff}.npl{display:flex;direction:ltr;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:-10px}
label{display:grid;gap:6px;font-size:13.5px;color:var(--mute)}
input,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--act)}textarea{resize:vertical;min-height:84px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{border:0;border-radius:14px;padding:14px;font:600 16px inherit;font-family:inherit;color:#fff;background:var(--act);cursor:pointer}.go:disabled{opacity:.5;cursor:default}
.msg{color:var(--bad);font-size:13.5px;text-align:center;min-height:18px}
.done{text-align:center;display:grid;gap:10px;justify-items:center;padding:20px 0}.done svg{width:64px;height:64px;color:var(--ok)}.done h1{margin:0;font-size:21px}.done p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.7}
.foot{text-align:center;color:var(--mute);font-size:12px}
@media (max-width:380px){.nps button{height:34px;font-size:13px}.stars button svg{width:36px;height:36px}}
</style>
<style>*{-webkit-tap-highlight-color:transparent}:where(button,a,[role=button],summary,label):focus:not(:focus-visible){outline:none}</style>
</head>
<body>
<main>
  <div class="top"><img src="/rate/icon.png" alt=""><div><b>مجمع لارين السكني</b><small>رأيك يساعدنا نخدمك بشكل أفضل</small></div></div>
  <div class="card" id="box"><p class="hint" style="margin:0;text-align:center">جارٍ التحميل…</p></div>
  <div class="foot">لن يُنشر اسمك ولا رقم هاتفك، ويصل تقييمك إلى إدارة المجمع مباشرة</div>
</main>
<script src="/rate/rate.js" defer></script>
</body>
</html>
