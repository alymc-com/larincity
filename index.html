<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لارين سيتي — قريباً جداً</title>
<meta name="description" content="مجمع مدينة لارين السكنية — بابل، مجاور جامعة الحلة. الموقع الإلكتروني قريباً جداً.">
<meta property="og:title" content="لارين سيتي — قريباً جداً">
<meta property="og:description" content="مجمع مدينة لارين السكنية — بابل، مجاور جامعة الحلة.">
<meta property="og:image" content="https://larincity.com/assets/aerial-sunset-02.jpg">
<link rel="icon" href="/assets/mark-gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#C9A45C; --gold-l:#E3C07A; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:Almarai,system-ui,sans-serif;background:#0B0A08;color:#fff;overflow:hidden;
  display:grid;place-items:center;text-align:center
}
.bg{position:fixed;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
.bg::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 50% 40%, rgba(11,10,8,.18) 0%, rgba(11,10,8,.72) 58%, rgba(11,10,8,.94) 100%),
    linear-gradient(180deg, rgba(11,10,8,.72) 0%, rgba(11,10,8,.30) 34%, rgba(11,10,8,.88) 100%)
}
main{position:relative;z-index:2;padding:32px 22px;display:flex;flex-direction:column;align-items:center;
  animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{width:clamp(150px,26vw,260px);height:auto;margin-bottom:clamp(22px,4vh,40px);
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
/* Arabic descenders (ج، ي) need real leading — line-height:1 clipped them,
   and background-clip:text crops anything outside the text box */
h1{font-size:clamp(38px,9vw,104px);font-weight:800;line-height:1.34;letter-spacing:-.01em;
  padding:.10em .06em .22em;
  background:linear-gradient(180deg,var(--gold-l),var(--gold));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.rule{width:clamp(70px,14vw,130px);height:2px;margin:clamp(18px,3vh,30px) 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
p.lead{font-size:clamp(15px,2vw,21px);font-weight:700;letter-spacing:.02em;opacity:.95}
p.sub{margin-top:12px;font-size:clamp(12px,1.5vw,15px);opacity:.62;letter-spacing:.14em}
footer{position:fixed;bottom:0;left:0;right:0;z-index:2;padding:20px clamp(16px,4vw,44px);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-size:11px;letter-spacing:.1em;opacity:.55}
footer img{height:26px;width:auto;opacity:.8}
@media(max-width:560px){footer{flex-direction:column;gap:10px;font-size:10px}}
</style>
</head>
<body>

<div class="bg"><img src="/assets/aerial-sunset-02.jpg" alt="مجمع مدينة لارين السكنية"></div>

<main>
  <img class="logo" src="/assets/logo-gold.png" alt="لارين سيتي">
  <h1>قريباً جداً</h1>
  <div class="rule"></div>
  <p class="lead">مجمع مدينة لارين السكنية</p>
  <p class="sub">بابل · مجاور جامعة الحلة</p>
</main>

<footer>
  <span>© ٢٠٢٦ لارين سيتي</span>
  <img src="/assets/bait.png" alt="بيت العطاء">
</footer>

</body>
</html>
